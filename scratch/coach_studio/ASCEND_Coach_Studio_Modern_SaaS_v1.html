function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const clients=[{id:'amara',name:'Amara Okafor',short:'AO',variant:'rose',goal:'Build muscle',phase:'Foundation',status:'Safety hold',statusTone:'red',plan:'Not active',review:'—',kind:'Private assessment',days:'—'},{id:'tunde',name:'Tunde Adebayo',short:'TA',variant:'green',goal:'Build muscle',phase:'Foundation',status:'Plan pending',statusTone:'amber',plan:'Draft v1',review:'After activation',kind:'Assessment complete',days:'—'},{id:'zara',name:'Zara Bello',short:'ZB',variant:'violet',goal:'Recomposition',phase:'Tame the Flesh',status:'Active',statusTone:'green',plan:'Training v2 · Nutrition v2',review:'13 Nov',kind:'Midpoint review due',days:'2/3 this week'},{id:'femi',name:'Femi Adeyemi',short:'FA',variant:'blue',goal:'Lose fat',phase:'Tame the Flesh',status:'Active',statusTone:'green',plan:'Training v1 · Nutrition v1',review:'16 Nov',kind:'Renewal review due',days:'3/3 this week'},{id:'kemi',name:'Kemi Musa',short:'KM',variant:'orange',goal:'Build strength',phase:'Tame the Flesh',status:'Active',statusTone:'green',plan:'Training v3 · Nutrition v2',review:'20 Nov',kind:'Normal',days:'2/3 this week'},{id:'dara',name:'Dara Nwosu',short:'DN',variant:'violet',goal:'Recomposition',phase:'Tame the Flesh',status:'Active',statusTone:'green',plan:'Training v1 · Nutrition v1',review:'24 Nov',kind:'Normal',days:'3/3 this week'}];
const tasks=[{id:'safety',priority:0,label:'Safety review',desc:'Private assessment requires restricted review',client:'amara',due:'Review required',dueTone:'red',section:'assessments',kind:'Safety'},{id:'plan',priority:1,label:'Programme approval',desc:'Draft training and nutrition awaiting review',client:'tunde',due:'Due in 1 day',dueTone:'amber',section:'programmes',kind:'Programme'},{id:'review',priority:2,label:'Midpoint review',desc:'Client check-in submitted',client:'zara',due:'Due today',dueTone:'amber',section:'reviews',kind:'Review'},{id:'message',priority:3,label:'Priority message',desc:'Equipment change needs timely reply',client:'kemi',due:'Coaching window',dueTone:'blue',section:'inbox',kind:'Message'},{id:'renewal',priority:4,label:'Renewal summary',desc:'End-of-month coaching decision',client:'femi',due:'16 Nov',dueTone:'neutral',section:'reviews',kind:'Review'}];

function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function menu(){const nav=[['overview','Overview','overview'],['clients','Clients','clients'],['assessments','Assessments','assessments'],['programmes','Programmes','programmes'],['reviews','Check-ins','reviews'],['inbox','Inbox','inbox']];return `<aside class="sidebar ${state.mobileNav?'mobile-open':''}" id="sidebar"><div class="brand"><div class="brand-mark">A</div><div><div class="brand-word">ASCEND</div><div class="brand-sub">BY SAHMI EL</div></div></div><div class="side-workspace">${ic('spark')}<div><strong>Coach Studio</strong><small>Private workspace</small></div><span class="workspace-pill">OWNER</span></div><div class="nav-label">Workspace</div><nav class="nav-group" aria-label="Coach workspace">${nav.map(([id,name,icon])=>`<button class="nav-item ${state.page===id?'active':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}>${ic(icon)}<span>${name}</span>${id==='inbox'?'<b class="count">1</b>':''}${id==='assessments'?'<b class="count">2</b>':''}</button>`).join('')}</nav><div class="nav-divider"></div><div class="nav-label">Management</div><div class="nav-group"><button class="nav-item ${state.page==='operations'?'active':''}" data-nav="operations">${ic('operations')}<span>Operations</span></button></div><div class="sidebar-spacer"></div><div class="sidebar-lower"><button class="nav-item" data-action="theme">${ic(theme==='dark'?'sun':'moon')}<span>${theme==='dark'?'Light appearance':'Dark appearance'}</span></button><button class="nav-item" data-action="reset">${ic('refresh')}<span>Reset example data</span></button><div class="coach-profile"><span class="avatar">SE</span><div><strong>Sahmi El</strong><small>Coach · Owner</small></div>${ic('more')}</div></div></aside>`}
function topbar(){const names={overview:'Overview',clients:'Clients',assessments:'Assessments',programmes:'Programmes',reviews:'Check-ins',inbox:'Inbox',operations:'Operations'};return `<header class="topbar"><div class="bread"><button class="icon-btn menu-toggle" aria-label="Open navigation" data-action="mobile-nav">${ic('menu')}</button><span>Coach Studio</span>${ic('chevron')}<strong>${names[state.page]}</strong></div><div class="top-actions"><button class="search-trigger" data-action="search" aria-label="Search clients and tasks">${ic('search')}<span>Search clients or tasks</span><span class="kbd">⌘ K</span></button><button class="icon-btn" data-nav="inbox" aria-label="Inbox notifications">${ic('bell')}<span class="dot"></span></button><span class="avatar" style="width:31px;height:31px;border-radius:50%">SE</span></div></header>`}
function header(eyebrow,title,subtitle,right=''){return `<div class="title-row"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-desc">${subtitle}</p></div><div class="top-buttons">${right}</div></div>`}
function kpi(label,value,foot,ico,bar=''){return `<div class="card kpi"><div class="kpi-head">${label} ${ic(ico)}</div><div class="kpi-val mono">${value}</div><div class="kpi-foot">${foot}</div>${bar?`<div class="progress-track"><span style="width:${bar}%"></span></div>`:''}</div>`}
function tasktable(showFilter){const selection=state.queueFilter;let visible=tasks.filter(t=>selection==='All'||(selection==='Safety'&&t.kind==='Safety')||(selection==='Due soon'&&['safety','plan','review','message'].includes(t.id))||(selection==='Reviews'&&t.kind==='Review'));return `<div class="card"><div class="panel-head"><div><div class="panel-title">Priority work queue</div><div class="panel-sub">Only coaching decisions that need your attention</div></div><div class="statusline">Demo tasks</div></div>${showFilter?`<div class="tabs">${['All','Due soon','Safety','Reviews'].map(v=>`<button class="tab ${v===selection?'active':''}" data-queue-filter="${v}">${v}</button>`).join('')}</div>`:''}<div class="table-wrap"><table><thead><tr><th>Work item</th><th>Client</th><th class="hide-mobile">Due</th><th style="text-align:right">Open</th></tr></thead><tbody>${visible.map(t=>{const c=getClient(t.client);return `<tr class="hoverable" data-open-task="${t.id}"><td><div class="queue-cell"><div class="queue-icon">${ic(t.id==='safety'?'shield':t.id==='message'?'inbox':t.id==='plan'?'programmes':'reviews')}</div><div><strong>${t.label}</strong><small>${t.desc}</small></div></div></td><td><div class="person">${av(c)}<div><strong>${c.name}</strong><small>${c.phase}</small></div></div></td><td class="hide-mobile">${pill(t.due,t.dueTone)}</td><td style="text-align:right"><button class="queue-action" data-open-task="${t.id}">Open →</button></td></tr>`}).join('')}</tbody></table></div><div class="panel-foot">Ordinary missed workouts do not create queue tasks. Safety concerns are handled separately.</div></div>`}
function overview(){return `${header('Workspace / Overview','Your coaching desk','A focused view of what needs action, not another activity feed.',`<span class="statusline">Demo workspace · ${esc('13 November 2026')}</span>`)}<div class="kpi-grid">${kpi('Active membership','6 / 10','4 remaining places','clients',60)}${kpi('Weekly onboardings','2 / 3','1 remaining this week','people',66.7)}${kpi('Items to address','4','1 safety-related','file')}${kpi('Next programme deadline','1 day','Five-business-day promise','clock')}</div><div class="columns"><div class="stack">${tasktable(true)}<div class="card"><div class="panel-head"><div><div class="panel-title">Client signals</div><div class="panel-sub">A quick overview, not automated coaching judgments</div></div><button class="btn small" data-nav="clients">All clients ${ic('arrow')}</button></div><div class="block-grid" style="padding:15px"><div class="mini-stat"><strong>4 / 6</strong><span>Example clients with active plans</span></div><div class="mini-stat"><strong>2</strong><span>Upcoming scheduled check-ins</span></div></div></div></div><div class="stack"><div class="card"><div class="panel-head"><div><div class="panel-title">Upcoming deadlines</div><div class="panel-sub">Within the current coaching window</div></div>${ic('calendar')}</div>${[['Today','Zara Bello','Midpoint review','reviews'],['Tomorrow','Tunde Adebayo','Programme delivery','programmes'],['16 Nov','Femi Adeyemi','Renewal review','reviews']].map(([d,n,sub,page])=>`<div class="list-row"><div class="list-left"><span class="queue-icon">${ic('clock')}</span><div><strong>${n}</strong><small>${sub}</small></div></div><div class="list-right"><small>${d}</small><button style="display:block;margin-left:auto;margin-top:4px" class="queue-action" data-nav="${page}">View</button></div></div>`).join('')}</div><div class="card"><div class="panel-head"><div><div class="panel-title">Delivery rhythm</div><div class="panel-sub">What the service promises</div></div>${ic('tr function clientsPage(){const visible=clients.filter(c=>(state.clientFilter==='All clients'||(state.clientFilter==='Active'&&c.status==='Active')||(state.clientFilter==='Needs setup'&&c.status!=='Active'))&&(`${c.name} ${c.goal} ${c.phase} ${c.status}`).toLowerCase().includes(state.clientSearch.toLowerCase()));return `${header('Workspace / Clients','Your athletes','Every client has one record, one active plan per type and a traceable review history.',`<button class="btn" data-action="search">${ic('search')} Find client</button>`)}<div class="card"><div class="list-toolbar"><input class="search-input" data-client-search value="${esc(state.clientSearch)}" aria-label="Search clients" placeholder="Search by client, goal or phase"/><select class="select" aria-label="Filter clients" data-client-filter>${['All clients','Active','Needs setup'].map(v=>`<option ${state.clientFilter===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Coaching goal</th><th class="hide-mobile">Programme / Phase</th><th>Status</th><th class="hide-mobile">Next review</th><th>Open</th></tr></thead><tbody>${visible.map(c=>`<tr class="hoverable" data-open-client="${c.id}"><td><div class="person">${av(c)}<div><strong>${c.name}</strong><small>${c.kind}</small></div></div></td><td>${c.goal}</td><td class="hide-mobile"><div>${c.plan}</div><div class="subtle" style="margin-top:4px">${c.phase}</div></td><td>${pill(c.status,c.statusTone)}</td><td class="hide-mobile muted">${c.review}</td><td><button class="queue-action" data-open-client="${c.id}">View →</button></td></tr>`).join('')}</tbody></table></div>${visible.length===0?`<div class="empty">No clients match your search.</div>`:''}<div class="panel-foot">Client photos and private health disclosures are not displayed on the roster.</div></div>`}
function assessmentPage(){const c=getClient(state.assess),flag=state.assess==='amara';return `${header('Workspace / Assessments','Assessment review','Review submitted private intake and separate confirmed facts from coaching interpretation.',`<button class="btn" data-nav="programmes">${ic('programmes')} Programme drafts</button>`)}<div class="split"><div class="card"><div class="panel-head"><div><div class="panel-title">Submitted assessments</div><div class="panel-sub">Registration itself does not require coach approval</div></div>${pill('2 for review','amber')}</div><div class="mini-list">${['amara','tunde'].map(id=>{let a=getClient(id);return `<button class="mini-row ${state.assess===id?'selected':''}" data-select-assessment="${id}">${av(a)}<span><strong>${a.name}</strong><small>${id==='amara'?'Safety review required':'Complete · awaiting coach interpretation'}</small></span>${ic('chevron')}</button>`}).join('')}</div><div class="panel-foot">Incomplete private assessments remain with the client until submitted or a real safety condition requires attention.</div></div><div class="card"><div class="panel-head"><div class="person">${av(c)}<div><div class="panel-title">${c.name}</div><div class="panel-sub">Nine-stage private assessment · Example</div></div></div>${pill(flag?'Programme activation held':'Assessment complete',flag?'red':'green')}</div><div class="tabs">${[['facts','Intake facts'],['safety','Safety & scope'],['interpretation','Coach interpretation']].map(([id,n])=>`<button class="tab ${state.assessTab===id?'active':''}" data-assess-tab="${id}">${n}</button>`).join('')}</div>${state.assessTab==='facts'?`<div class="section"><div class="definition-grid"><div><div class="field-label">Primary goal</div><div class="field-val">${c.goal}</div></div><div><div class="field-label">Training access</div><div class="field-val">${flag?'Home gym, dumbbells':'Commercial gym'}</div></div><div><div class="field-label">Available sessions</div><div class="field-val">${flag?'3 days / week':'3 days / week'}</div></div><div><div class="field-label">Nutrition preference</div><div class="field-val">${flag?'Simple (client preference)':'Structured (client preference)'}</div></div><div><div class="field-label">Assessment status</div><div class="field-val">Submitted · 12 Nov</div></div><div><div class="field-label">Delivery window</div><div class="field-val">Five business days after complete assessment, subject to safety</div></div></div></div><div class="section"><div class="section-title">Client-reported context</div><div class="step-list"><div class="step"><span class="step-number">1</span><div><strong>Training experience</strong><small>Inconsistent early-stage gym experience; prefers repeatable schedule.</small></div></div><div class="step"><span class="step-number">2</span><div><strong>Food environment</strong><small>Everyday Nigerian meals; limited weekday meal-prep time.</small></div></div></div></div>`:state.assessTab==='safety'?`<div class="section"><div class="info-banner ${flag?'danger':''}">${ic('shield')}<div><strong>${flag?'Further professional advice required':'No open flag shown in this demo'}.</strong> ${flag?'A submitted PAR-Q+ record indicates further guidance is needed before training or nutrition activation. Sahmi must not provide medical clearance.':'Programme activation still requires a completed, versioned pre-participation assessment and applicable safeguards.'}</div></div><div class="rule"></div><div class="definition-grid"><div><div class="field-label">PAR-Q+ status</div><div class="field-val">${flag?'Further advice required':'No flagged response in example'}</div></div><div><div class="field-label">Programme activation</div><div class="field-val">${flag?'Blocked':'Eligible for coach approval after checks'}</div></div></div><div class="rule"></div><div class="section-title">Allowed next step</div><p class="workspace-hint">${flag?'Request relevant professional advice or restrictions. Save a coaching note and continue the safety hold; do not clear or prescribe automatically.':'Continue coach interpretation. No automated publication.'}</p>${flag?`<button class="btn" data-action="request-document">${ic('file')} ${state.documentRequested?'Request noted (demo)':'Request relevant documentation'}</button>`:''}</div>`:`<div class="section"><div class="section-title">Confirmed facts vs coaching judgment</div><p class="workspace-hint">Assessment answers remain the client's statements. Record your interpretation separately, including the rationale, uncertainty and what requires follow-up.</p><label class="input-label" for="coach-interpret">Coach interpretation</label><textarea id="coach-interpret" class="text-field" data-coach-note="${state.assess}" placeholder="Write evidence-led interpretation, constraints and review questions...">${esc(state.coachNotes[state.assess])}</textarea><div class="info-banner" style="margin-top:12px">${ic('info')}<div>All data here is fictional. Saving does not notify a client or change safety eligibility.</div></div></div>`}<div class="save-row"><span class="audit-note">Source: private assessment · read-only facts</span><button class="btn" data-action="save-interpretation">Save coaching note</button><button class="btn primary" data-action="assessment-next" ${flag?'disabled title="Safety hold blocks programme activation"':''}>${flag?'Activation blocked':'Open programme builder'} ${ic('arrow')}</button></div></div></div>`}
function programmesPage(){const c=getClient(state.programme),blocked=state.programme==='amara';return `${header('Workspace / Programmes','Programme builder','Draft the plan, review its evidence, then publish a new version deliberately.',`<button class="btn" data-action="preview-version">${ic('eye')} Preview client view</button>`)}<div class="split"><div class="stack"><div class="card"><div class="panel-head"><div><div class="panel-title">Programme workflow</div><div class="panel-sub">One active version of training and nutrition per client</div></div></div><div class="mini-list">${[['tunde','Draft v1','amber'],['zara','Active v2','green'],['amara','Safety hold','red']].map(([id,l,t])=>{let a=getClient(id);return `<button class="mini-row ${state.programme===id?'selected':''}" data-select-programme="${id}">${av(a)}<span><strong>${a.name}</strong><small>${l}</small></span>${pill(l,t)}</button>`}).join('')}</div></div><div class="card"><div class="panel-head"><div class="panel-title">Publication policy</div>${ic('lock')}</div><div class="section"><div class="step-list">${[['Draft','Prepare and revise the programme.'],['Review','Verify safety, equipment, exercise prescription and recipe values.'],['Publish','Sahmi explicitly approves the version; prior Active is retained as Superseded.']].map(([a,b],i)=>`<div class="step"><span class="step-number">${i+1}</span><div><strong>${a}</strong><small>${b}</small></div></div>`).join('')}</div></div></div></div><div class="card"><div class="panel-head"><div class="person">${av(c)}<div><div class="panel-title">${c.name}</div><div class="panel-sub">${blocked?'No active plan · safety hold':state.programme==='tunde'?state.planVersion+' · created 12 Nov':'Active v2 · prior version preserved'}</div></div></div>${pill(blocked?'Safety hold':state.programme==='tunde'?state.planVersion:'Active',blocked?'red':state.programme==='tunde'?(state.planApproved?'green':'amber'):'green')}</div><div class="tabs">${[['training','Training'],['nutrition' nutrition'?`<div class="section"><div class="summary-line"><strong>Nutrition · Structured</strong>${pill('Grams-only','gold')}</div><div class="editor-row" style="grid-template-columns:90px minmax(120px,1fr) 85px minmax(110px,1fr)"><div class="editor-head">MEAL</div><div class="editor-head">FOOD / STATE</div><div class="editor-head">GRAMS</div><div class="editor-head">SECOND ITEM</div></div>${state.nutrition.map((x,i)=>`<div class="editor-row" style="grid-template-columns:90px minmax(120px,1fr) 85px minmax(110px,1fr)"><div class="editor-label">${x.meal}</div><div class="editor-label">${x.food}</div><input class="small-field" value="${esc(x.amount)}" data-nutrition-field="${i}:amount" aria-label="${x.meal} food quantity" ${!state.planEdit||state.programme!=='tunde'||state.planApproved?'disabled':''}/><div class="editor-label" style="font-weight:500">${x.other}</div></div>`).join('')}<div class="rule"></div><div class="info-banner warn">${ic('info')}<div><strong>Example foods only.</strong> Gram quantities and recipes in this demo have no verified nutritional calculation. Production publishing requires traceable source values, preparation state, recipe yield and approved swaps.</div></div></div>`:`<div class="section"><div class="timeline">${[['Draft v1','Training and nutrition draft · not visible to client'],['Active','Only one Active training plan and one Active nutrition plan are permitted'],['Superseded','Prior plans and connected logs remain unmodified']].map(([a,b])=>`<div class="timeline-item"><span class="timeline-dot"></span><div><strong>${a}</strong><small>${b}</small></div></div>`).join('')}</div></div>`}<div class="save-row"><span class="audit-note">${state.programme==='tunde'?(state.planDraftDirty?'Unsaved demo edits':'Coach review required before publish'):'Read-only approved programme preview'}</span>${state.programme==='tunde'&&!state.planApproved&&state.programTab!=='versions'?`<button class="btn" data-action="toggle-edit">${ic('edit')} ${state.planEdit?'Stop editing':'Edit draft'}</button><button class="btn" data-action="save-programme">Save draft</button>`:''}${state.programme==='tunde'&&state.planApproved?`<button class="btn" data-action="new-version">New revision draft</button>`:''}<button class="btn primary" data-action="publish-plan" ${state.programme!=='tunde'||state.planApproved?'disabled':''}>${ic('check')} Review & publish</button></div></div></div>`}
function reviewsPage(){const c=getClient(state.review);return `${header('Workspace / Check-ins','Scheduled coaching reviews','Two personal reviews per billing month. Assess evidence and publish considered decisions.',`<button class="btn" data-action="review-summary">${ic('file')} Review summary</button>`)}<div class="split"><div class="card"><div class="panel-head"><div><div class="panel-title">Review queue</div><div class="panel-sub">No daily intervention for ordinary missed workouts</div></div>${pill('2 scheduled','gold')}</div><div class="mini-list">${[['zara','Midpoint · Due today'],['femi','Renewal · 16 Nov']].map(([id,l])=>{const a=getClient(id);return `<button class="mini-row ${id===state.review?'selected':''}" data-select-review="${id}">${av(a)}<span><strong>${a.name}</strong><small>${l}</small></span>${ic('chevron')}</button>`}).join('')}</div></div><div class="card"><div class="panel-head"><div><div class="panel-title">Review signals</div><div class="panel-sub">Facts first, decisions second</div></div>${ic('trending')}</div><div class="section"><div class="summary-line"><strong>Training completed</strong><span>${state.review==='zara'?'5 of 6 planned sessions':'6 of 6 planned sessions'}</span></div><div class="summary-line"><strong>Nutrition updates</strong><span>${state.review==='zara'?'10 recorded · 4 not recorded':'13 recorded · 1 not recorded'}</span></div><div class="summary-line"><strong>Bodyweight trend</strong><span>${state.review==='zara'?'−0.3 kg over 2 weeks':'−0.5 kg over 4 weeks'} (example)</span></div><div class="summary-line"><strong>Recovery and pain</strong><span>${state.review==='zara'?'Client reports normal recovery':'No new issues reported'}</span></div></div></div></div><div class="card"><div class="panel-head"><div class="person">${av(c)}<div><div class="panel-title">${c.name} · ${state.review==='zara'?'Midpoint':'Renewal'} check-in</div><div class="panel-sub">Scheduled coaching review · Example evidence</div></div></div>${pill(state.review==='zara'?'Due today':'16 Nov','amber')}</div><div class="section"><div class="section-title">Client-reported summary</div><div class="notice">“I completed most sessions. The evening meal was difficult on two workdays. Recovery feels manageable.”</div><p class="workspace-hint" style="margin-top:12px">Unrecorded meals are unknown—not automatically missed or non-adherent. A missed gym session carries no penalty and creates no extra review.</p></div><div class="section"><div class="section-title">Coach decision</div><div class="pillbox" style="margin-bottom:12px">${['Hold plan','Minor adjustment','Major redesign','Clarification','Referral/outside scope'].map(v=>`<label class="radio-choice"><input type="radio" name="review-decision" value="${v}" ${state.reviewDecision===v?'checked':''}/> ${v}</label>`).join('')}</div><label class="input-label">Coaching interpretation and rationale</label><textarea class="text-field" data-review-note placeholder="Explain what the records support, what is uncertain, and the next coaching decision...">${esc(state.reviewDraft)}</textarea><div class="info-banner" style="margin-top:13px">${ic('info')}<div>A major redesign is limited to one per billing month when materially justified. A saved review does not silently publish a changed plan.</div></div></div><div class="save-row"><span class="audit-note">${state.reviewSaved?'Review saved in this demo session':'Personal approval required'}</span><button class="btn" data-action="save-review">Save review draft</button><button class="btn primary" data-action="complete-review">Record coach review ${ic('check')}</button></div></div></div>`}
function inboxPage(){const c=getClient(state.inbox),m=messages.find(m=>m.id===state.inbox);return `${header('Workspace / Inbox','Client messages','Priority coaching concerns are handled within the stated service window; routine questions wait for review.',`<span class="tag neutral">Mon–Sat coaching days</span>`)}<div class="split"><div class="card"><div class="panel-head"><div><div class="panel-title">Conversations</div><div class="panel-sub">One example priority message</div></div></div><div class="mini-list">${messages.map(m=>{let c=getClient(m.client);return `<button class="mini-row ${state.inbox===m.id?'selected':''}" data-select-message="${m.id}">${av(c)}<span><strong>${c.name}</strong><small>${m.subject}</small></span>${m.priority?pill('Priority','amber'):pill('Normal','neutral')}</button>`}).join('')}</div></div><div class="card"><div class="panel-head"><div class="panel-title">Message policy</div>${ic('info')}</div><div class="section"><div class="summary-line"><strong>High-priority allowance</strong><span>2 per client per billing month</span></div><div class="summary-line"><strong>Response commitment</strong><span>Within 24 hours during coaching days</span></div><div class="summary-line"><strong>Ordinary messages</strong><span>Addressed at scheduled review</span></div><div class="notice">The inbox is coaching support, not emergency or medical care.</div></div></div></div><div class="card"><div class="panel-head"><div class="person">${av(c)}<div><div class="panel-title">${c.name} · ${m.subject}</div><div class="panel-sub">${m.when} · ${m.priority?'High priority':'Routine message'}</div></div></div>${pill(m.status,m.priority?'amber':'neutral')}</div><div class="section"><div class="output-preview"><strong>Client message</strong><p>${esc(m.body)}</p></div><label class="input-label" style="margin-top:18px">${m.priority?'Coach reply':'Note for the next scheduled review'}</label><textarea class="text-field" data-message-reply="${m.id}" placeholder="Write a concise, practical response...">${esc(m.reply)}</textarea><p class="workspace-hint" style="margin:10px 0 0">${m.priority?'Replying to an equipment problem may require a new approved substitute or programme change. A message alone cannot update the active programme.':'Routine questions are collected for the next scheduled review. No new immediate response promise is created.'}</p></div><div class="save-row"><span class="audit-note">Private coach-client correspondence · demo only</span><button class="btn primary" data-action="send-message">${m.priority?'Simulate reply':'Save review note'} ${ic('arrow')}</button></div></div></div>`}

if(state.modal==='review-summary'){return `<div class="modal-shade" data-shade="modal"><div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">Review summary</div><div class="modal-title">A coach-authored decision</div><p class="modal-desc">At renewal, the real output will include a concise progress summary, the evidence-led coaching decision, three priorities for the next billing month and the dates of the next two personal reviews. The programme remains unchanged until any necessary new draft is approved.</p><div class="modal-footer"><button class="btn" data-action="close-modal">Close</button></div></div></div>`}
return ''}
function search(){if(!state.search)return '';return `<div class="search-shade" data-shade="search"><div class="search-modal" role="dialog" aria-modal="true" aria-label="Global search"><input id="global-search" type="search" autocomplete="off" placeholder="Search clients, programmes or reviews..." value="${esc(state.searchQuery)}"/><div class="search-results" id="search-results">${searchResults()}</div><div class="panel-foot">Search sample client records; no external service connected. Esc to close.</div></div></div>`}
function searchResults(){const q=state.searchQuery.trim().toLowerCase();const found=clients.filter(c=>!q||`${c.name} ${c.goal} ${c.status}`.toLowerCase().includes(q));if(!found.length)return `<div class="empty">No matching client.</div>`;return found.map(c=>`<button class="search-result" data-open-client="${c.id}">${av(c)}<span>${c.name}</span><small>${c.status}</small>${ic('chevron')}</button>`).join('')}
function page(){const pages={overview,clients:clientsPage,assessments:assessmentPage,programmes:programmesPage,reviews:reviewsPage,inbox:inboxPage,operations:operationsPage};return (pages[state.page]||overview)()}
function render(opts={}){document.getElementById('app').innerHTML=`<div class="app">${menu()}<div class="mobile-backdrop ${state.mobileNav?'active':''}" data-action="close-nav"></div><div class="main">${topbar()}<main class="content" id="main-content">${page()}</main></div></div><div class="prototype-ribbon">DESIGN PROTOTYPE · Fictional clients · No data is sent or published</div>${drawer()}${modal()}${search()}`;if(opts.focusSearch){const e=document.getElementById('global-search');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
function go(p){state.page=p;state.mobileNav=false;state.clientDrawer=null;state.search=false;state.modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function taskGo(id){const t=tasks.find(t=>t.id===id);if(!t)return;state.assess=t.client;state.programme=t.client;state.review=t.client;state.inbox=t.client;state.assessTab=t.id==='safety'?'safety':'facts';state.programTab='training';go(t.section)}
function getDraftValues(){document.querySelectorAll('[data-set-field]').forEach(el=>{const [i,k]=el.dataset.setField.split(':');state.training[Number(i)][k]=el.value});document.querySelectorAll('[data-nutrition-field]').forEach(el=>{const [i,k]=el.dataset.nutritionField.split(':');state.nutrition[Number(i)][k]=el.value})}
function act(a,el){if(a==='theme'){theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('ascend_coach_theme',theme)}catch(e){}render();return}if(a==='reset'){location.reload();return}if(a==='search'){state.search=true;state.mobileNav=false;render({focusSearch:true});return}if(a==='mobile-nav'){state.mobileNav=!state.mobileNav;render();return}if(a==='close-nav'){state.mobileNav=false;render();return}if(a==='close-drawer'){state.clientDrawer=null;render();return}if(a==='close-modal'){state.modal=null;render();return}if(a==='save-interpretation'){toast('Coaching note saved in demo only');return}if(a==='request-document'){state.documentRequested=true;render();toast('Request recorded locally in demo · no message sent');return}if(a==='assessment-next'){if(state.assess==='amara'){toast('Safety hold remains active');return}state.programme=state.assess;go('programmes');return}if(a==='toggle-edit'){if(state.planEdit)getDraftValues();state.planEdit=!state.planEdit;render();return}if(a==='save-programme'){getDraftValues();state.planDraftDirty=false;state.planEdit=false;render();toast('Draft saved in this prototype · not shared with client');return}if(a==='preview-version'){getDraftValues();state.modal='programme-preview';render();return}if(a==='new-version'){if(!state.planApproved)return;state.planApproved=false;state.planVersion='Draft v2 (demo)';state.planEdit=false;state.planDraftDirty=false;render();toast('New revision created in demo; previous Active version is preserved');return}if(a==='publish-plan'){if(state.programme!=='tunde'||state.planApproved){toast('Cannot publish this programme in the demo');return}getDraftValues();state.modal='publish';render();return}if(a==='confirm-publish'){if(!Array.from(document.querySelectorAll('.publish-check')).every(c=>c.checked))return;state.planVersion='Active v1 (demo)';state.planApproved=true;state.planEdit=false;state.modal=null;render();toast('Publication simulated only · no real plan changed');return}if(a==='save-review'){state.reviewSaved=true;render();toast('Review draft saved locally in demo');return}if(a==='complete-review'){const t=document.querySelector('[data-review-note]');if(t)state.reviewDraft=t.value;if(state.reviewDraft.trim().length<12){toast('Add a brief coaching rationale before recording');return}state.modal='review';render();return}if(a==='confirm-review'){state.modal=null;state.reviewSaved=true;render();toast('Coach review recorded in demo · no actual client update');return}if(a==='review-summary'){state.modal='review-summary';render();return}if(a==='send-message'){const t=document.querySelector('[data-message-reply]'),m=messages.find(x=>x.id===state.inbox);if(t)m.reply=t.value;if(!m.reply.trim()){toast('Write a message first');return}m.status=m.priority?'Reply drafted':'Note saved';render();toast(m.priority?'Demo reply captured · not delivered':'Saved for next review · demo only');return}if(a==='drawer-to-assessment'){state.assess=el.dataset.clientId;state.assessTab='facts';if(!['amara','tunde'].includes(state.assess)){toast('Only two sample assessments are available');return}go('assessments');return}if(a==='drawer-to-programme'){state.programme=el.dataset.clientId;state.programTab='training';go('programmes');return}if(a==='drawer-to-review'){if(!['zara','femi'].includes(el.dataset.clientId)){toast('No scheduled example review for this client');return}state.review=el.dataset.clientId;go('reviews');return}}
document.addEventListener('click',e=>{const t=e.target;const el=t.closest('[data-action],[data-nav],[data-open-task],[data-open-client],[data-select-assessment],[data-select-programme],[data-select-review],[data-select-message],[data-queue-filter],[data-assess-tab],[data-program-tab]');if(!el){if(t.matches('[data-shade]')){if(t.dataset.shade==='drawer')state.clientDrawer=null;if(t.dataset.shade==='modal')state.modal=null;if(t.dataset.shade==='search')state.search=false;render()}return}
if(el.dataset.action){act(el.dataset.action,el);return}if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.openTask){taskGo(el.dataset.openTask);return}if(el.dataset.openClient){state.search=false;state.clientDrawer=el.dataset.openClient;render();return}if(el.dataset.selectAssessment){state.assess=el.dataset.selectAssessment;state.assessTab='facts';state.programme=state.assess;go('assessments');return}if(el.dataset.selectProgramme){getDraftValues();state.programme=el.dataset.selectProgramme;state.programTab='training';state.planEdit=false;render();return}if(el.dataset.selectReview){state.review=el.dataset.selectReview;state.reviewSaved=false;state.reviewDraft='';render();return}if(el.dataset.selectMessage){state.inbox=el.dataset.selectMessage;render();return}if(el.dataset.queueFilter){state.queueFilter=el.dataset.queueFilter;render();return}if(el.dataset.assessTab){state.assessTab=el.dataset.assessTab;render();return}if(el.dataset.programTab){getDraftValues();state.programTab=el.dataset.programTab;render();return}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-client-filter]')){state.clientFilter=t.value;render()}if(t.name==='review-decision'){state.reviewDecision=t.value}if(t.matches('.publish-check')){const b=document.getElementById('confirm-publish');if(b)b.disabled=!Array.from(document.querySelectorAll('.publish-check')).every(c=>c.checked)}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-client-search]')){state.clientSearch=t.value;const st=t.selectionStart;render();const x=document.querySelector('[data-client-search]');if(x){x.focus();try{x.setSelectionRange(st,st)}catch(e){}}}if(t.matches('[data-coach-note]')){state.coachNotes[t.dataset.coachNote]=t.value}if(t.matches('[data-review-note]')){state.reviewDraft=t.value}if(t.matches('[data-message-reply]')){const m=messages.find(x=>x.id===t.dataset.messageReply);m.reply=t.value}if(t.matches('[data-set-field],[data-nutrition-field]')){state.planDraftDirty=true}if(t.matches('#global-search')){state.searchQuery=t.value;const x=document.getElementById('search-results');if(x)x.innerHTML=searchResults()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.search=true;render({focusSearch:true})}else if(e.key==='Escape'){if(state.modal||state.search||state.clientDrawer||state.mobileNav){state.modal=null;state.search=false;state.clientDrawer=null;state.mobileNav=false;render()}}});
render();})();
</script>
</body></html>
